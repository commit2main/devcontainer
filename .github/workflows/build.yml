name: build

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * 0"
  push:
    branches: [main]
  pull_request:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/universal

jobs:
  tags:
    runs-on: ubuntu-latest
    outputs:
      tags: ${{ steps.tags.outputs.tags }}
    steps:
      # Computed once so both architectures and the merge agree, even across midnight.
      - id: tags
        run: echo "tags=latest,$(date -u +%Y.%m.%d)" >> "$GITHUB_OUTPUT"

  build:
    needs: tags
    name: Build ${{ matrix.platform }}
    strategy:
      matrix:
        include:
          - runner: ubuntu-latest
            platform: linux/amd64
          - runner: ubuntu-24.04-arm
            platform: linux/arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Login to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # Pushes per-platform tags such as latest-linux-arm64; the merge job joins them.
      - name: Build, test and push ${{ matrix.platform }}
        uses: devcontainers/ci@513af61f4de4f75d37e4438f184ba4358f0fc1ca # v0.3.1900000450
        with:
          imageName: ${{ env.IMAGE }}
          imageTag: ${{ needs.tags.outputs.tags }}
          platform: ${{ matrix.platform }}
          useNativeRunner: true
          cacheFrom: ${{ env.IMAGE }}:latest-${{ matrix.platform == 'linux/amd64' && 'linux-amd64' || 'linux-arm64' }}
          noCache: ${{ github.event_name == 'schedule' }}
          runCmd: >-
            python3 --version && node --version && pnpm --version && go version && cargo --version
            && java -version && gh --version && uv --version && ruff --version && pre-commit --version
            && clang-format --version && omp --version && claude --version
          push: ${{ github.event_name == 'pull_request' && 'never' || 'always' }}

  merge:
    if: github.event_name != 'pull_request'
    needs: [tags, build]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Merge platforms into one multi-arch image
        uses: devcontainers/ci/merge@513af61f4de4f75d37e4438f184ba4358f0fc1ca # v0.3.1900000450
        with:
          imageName: ${{ env.IMAGE }}
          imageTag: ${{ needs.tags.outputs.tags }}
          platforms: linux/amd64,linux/arm64

      - name: Look up the image digest
        id: digest
        run: echo "digest=$(docker buildx imagetools inspect "$IMAGE:latest" --format '{{json .Manifest}}' | jq -r .digest)" >> "$GITHUB_OUTPUT"

      # Signed record of which workflow run built the image: `gh attestation verify oci://<image> -o commit2main`
      - name: Attest build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.digest.outputs.digest }}
          push-to-registry: true
