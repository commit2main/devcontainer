name: "build"
on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * 0'
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    name: Build and push Dev Container image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Login to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pre-build and push Dev Container image
        uses: devcontainers/ci@v0.3
        with:
          imageName: ghcr.io/${{ github.repository_owner }}/universal
          cacheFrom: ghcr.io/${{ github.repository_owner }}/universal
          noCache: ${{ github.event_name == 'schedule' }}
          runCmd: uv --version && uvx --version && ruff --version && pre-commit --version && opencode --version && claude --version && clang-format --version
          push: ${{ github.event_name == 'pull_request' && 'never' || 'always' }}
