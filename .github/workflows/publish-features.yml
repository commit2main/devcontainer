name: Publish Features

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .devcontainer/features/claude-code/**
      - .devcontainer/features/claude-credentials/**
      - .devcontainer/features/omp/**
      - .devcontainer/features/omp-credentials/**
      - .github/workflows/publish-features.yml

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Only these Features are published; the rest are image-only. A Feature republishes when its
      # devcontainer-feature.json version changes.
      - name: Stage published Features
        run: |
          mkdir -p publish-features
          for feature in claude-code claude-credentials omp omp-credentials; do
            cp -R ".devcontainer/features/$feature" publish-features/
          done

      - name: Publish to GHCR
        uses: devcontainers/action@bef2cf2d1a019b00b45e184f83035e01bd1972f3 # v1.4.4
        with:
          publish-features: "true"
          base-path-to-features: ./publish-features
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
