name: Publish oh-my-pi Credentials Feature

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .devcontainer/features/omp-credentials/**
      - .github/workflows/publish-omp-credentials.yml

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7

      - name: Stage oh-my-pi Credentials Feature
        run: |
          mkdir -p publish-features
          cp -R .devcontainer/features/omp-credentials publish-features/omp-credentials

      - name: Publish to GHCR
        uses: devcontainers/action@v1
        with:
          publish-features: "true"
          base-path-to-features: "./publish-features"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
